<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CyberFusion — Secure Access</title><link rel="stylesheet" href="css/app.css"></head><body class="auth-body"><div class="auth-shell"><div class="auth-card"><div class="brand-mark">CF</div><div class="eyebrow">CYBERFUSION</div><h1>Security intelligence, correlated.</h1><p class="muted">AI-assisted multi-source cybersecurity correlation and digital forensics.</p><form id="loginForm" class="stack"><label>Username<input id="username" value="admin" autocomplete="username"></label><label>Password<input id="password" type="password" value="ChangeMe123!" autocomplete="current-password"></label><button class="primary" type="submit">Enter Security Console</button><div id="loginError" class="error"></div></form><div class="auth-meta"><span>Risk engine</span><span>Correlation</span><span>Forensics</span></div></div></div><script src="config.js"></script><script src="js/api.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='';try{await API.login(document.getElementById('username').value,document.getElementById('password').value);location.href='dashboard.html'}catch(ex){err.textContent=ex.message||'Login failed'}});</script></body></html>
